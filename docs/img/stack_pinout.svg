<text x="226" y="361" font-size="9" text-anchor="start" fill="#000000" font-weight="normal" >pins: loose 0.4 mm header pins, or a 2×10 + 1×10 THT header,</text>
<text x="226" y="374" font-size="9" text-anchor="start" fill="#000000" font-weight="normal" >soldered on both boards; gap set by a jig (2.5–3 mm)</text>
<text x="226" y="393" font-size="9" text-anchor="start" fill="#000000" font-weight="normal" >HMI boards populate only the positions they use;</text>
<text x="226" y="406" font-size="9" text-anchor="start" fill="#000000" font-weight="normal" >row A columns 1 and 10 always (power + mechanical)</text></svg>