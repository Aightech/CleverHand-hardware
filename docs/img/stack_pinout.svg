<text x="1040" y="70" font-size="12" text-anchor="start" fill="#000000" font-weight="bold" >Reading the field</text>
<text x="1040" y="86" font-size="10" text-anchor="start" fill="#000000" font-weight="normal" >every hole is plated: one pin, one net,</text>
<text x="1040" y="98" font-size="10" text-anchor="start" fill="#000000" font-weight="normal" >from the bus board down to the last HMI board</text>
<text x="1040" y="116" font-size="10" text-anchor="start" fill="#000000" font-weight="normal" >AUX0..3 come from the bus cable,</text>
<text x="1040" y="128" font-size="10" text-anchor="start" fill="#000000" font-weight="normal" >AUX4..7 stay inside the node</text>
<text x="1040" y="146" font-size="10" text-anchor="start" fill="#000000" font-weight="normal" >VIN: battery / 5 V for actuators or a local LDO</text>
